{% extends 'job/base.html' %}
{% load static %}
{% block title %} User Login {% endblock title %}
{% block content %}
<div class="loginbg">
<div class="login-box">
      <h1>Login</h1>
      <form method="post">
      {% csrf_token %}
        <label>Email</label>
        <input type="email" placeholder="" name="uname"/>
        <label>Password</label>
        <input type="password" placeholder="" name="pwd3" id="password"  />
        <i class="fa fa-eye" aria-hidden="true" id="eye" onclick="toggle()"></i>
        <input type="submit" value="Submit" />
      </form>
    </div>
    <div class="para-signup">
    <p class="para-2">
      Not have an account? <a href="{% url 'signup_jobseeker' %}">Sign Up Here</a>
    </p>
    </div>
    </div>


  {% ifequal error "no" %}
    <script>
    alert("Login successfully");
    window.location = ('{% url 'user_home' %}');
    </script>
    {%endifequal%}

    {% ifequal error "yes" %}
    <script>
    alert("Invalid Login credential");
    </script>
{%endifequal%}

<script>
  var state= false;
		function toggle(){
			if(state){
				document.getElementById("password").setAttribute("type","password");
				document.getElementById("eye").style.color='#7a797e';
				state = false;
			}
			else{
				document.getElementById("password").setAttribute("type","text");
				document.getElementById("eye").style.color='#009688';
				state = true;
			}
		}
</script>

{%endblock content%}

{% extends 'job/recruiter_navigation.html' %}
{% load static %}
{% block title %} job_list {% endblock title%}
{% block content %}
<div class="bg1">
<div class="hedinglist">
<br>
<br>

<h2 style="text-align:center;font-size:40px;margin-top:-16px;">Job List </h2>
</div>
<div class="listing">
<table class="table table-hover" id="example" >
<thead>
<tr style="text-align:center;">
    <th>S.No.</th>
    <th>Job Title</th>
    <th>CreationDate</th>
    <th>Action</th>
</tr>
</thead>

    <tbody>
        {% for i in job %}
            <tr style="background-color:#485461;text-align:center;">
                <td>{{forloop.counter}}</td>
                <td>{{i.title}}</td>
                <td>{{i.creation_date}}</td>
                <td><a href="{% url 'edit_jobdetail' i.id %}" class="btn btn-success btn-sm">edit</a> | <a href="#" class="btn btn-danger btn-sm">Delete</a></td>
            </tr>
        {%endfor%}
    </tbody>
</table>
<br>
</div>
</div>

{% endblock content %}

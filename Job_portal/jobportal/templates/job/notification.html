{% extends 'job/recruiter_navigation.html' %}
{% load static %}
{% block title %} Notification {% endblock title %}
{% block content %}
<div class="notification">
    <br>
    <h2><center>Candidates who Worked Here</center></h2>
    <div class="not_box">
        <table class="table table-hover" id="example" >
            <thead>
            <tr style="text-align:center;">
                <th>S.No.</th>
                <th>Candidate Name</th>
                <th>Review</th>
            </tr>
            </thead>
            
                <tbody>
                    {% for i in jobseeker %}
                        <tr style="background-color:#485461;text-align:center;">
                            <td>{{forloop.counter}}</td>
                            <td>s{{i.b.first_name}}</td>
                            <td>{}</td>
                        </tr>
                    {%endfor%}
                </tbody>
            </table>
    </div>
</div>
{% endblock content %}
